<!DOCTYPE html>
<!-- Define o tipo de documento como HTML5 e o idioma principal como Português do Brasil -->
<html lang="pt-BR">
<head>
    <!-- Configuração da codificação de caracteres para suportar acentos e símbolos -->
    <meta charset="UTF-8">
    
    <!-- Torna a página responsiva, ajustando a escala de visualização para celulares e telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece na aba do navegador -->
    <title>Cauã Duarte | Desenvolvedor Front-End & Soluções Web</title>

    <!-- ============================================== -->
    <!-- META TAGS DE SEO E OTIMIZAÇÃO PARA BUSCAS      -->
    <!-- ============================================== -->
    
    <!-- Descrição que aparece nos resultados de busca do Google -->
    <meta name="description" content="Portfólio de Cauã Duarte, Desenvolvedor Front-End especializado em React.js, Vite e criação de sites institucionais, landing pages e soluções web de alta conversão.">
    
    <!-- Palavras-chave principais para indexação nos buscadores -->
    <meta name="keywords" content="Desenvolvedor Front-End, React.js, Vite, Criação de Sites, Landing Pages, Portfólio, Web Designer, São Paulo">
    
    <!-- Autor do projeto -->
    <meta name="author" content="Cauã Duarte">
    
    <!-- Controla a indexação e o rastreio por robôs de busca -->
    <meta name="robots" content="index, follow">

    <!-- ============================================== -->
    <!-- OPEN GRAPH (Otimizado para WhatsApp, LinkedIn, etc.) -->
    <!-- ============================================== -->
    
    <!-- Título exibido no preview do link compartilhado -->
    <meta property="og:title" content="Cauã Duarte | Desenvolvedor Front-End & Soluções Web">
    
    <!-- Descrição exibida no preview do link compartilhado -->
    <meta property="og:description" content="Transforme sua presença digital. Conheça meus projetos e contrate soluções em desenvolvimento front-end e landing pages de alta conversão.">
    
    <!-- Tipo de conteúdo da página -->
    <meta property="og:type" content="website">
    
    <!-- URL principal do seu site (substitua pelo link real quando publicar) -->
    <meta property="og:url" content="https://seusite.com.br">
    
    <!-- Imagem de visualização do preview (adicione um print do seu portfólio depois na raiz com o nome banner.png) -->
    <meta property="og:image" content="https://seusite.com.br/banner.png">
    <meta property="og:locale" content="pt_BR">

    <!-- Conexão prévia com os servidores do Google Fonts para carregar as fontes mais rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Importação da fonte 'Plus Jakarta Sans' para dar um visual moderno e limpo -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Importação da biblioteca FontAwesome para habilitar o uso de ícones vetoriais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Importação do arquivo de estilos CSS externo onde ficará a estilização visual -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
</body>
</html>
